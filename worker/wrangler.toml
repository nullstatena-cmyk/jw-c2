name = "jw-cleaning-intake"
main = "src/index.js"
compatibility_date = "2026-01-01"

[[d1_databases]]
binding = "DB"
database_name = "jw-cleaning-2"
database_id = "e3caf26d-aed9-4019-a74f-0a301e7f054a"

[triggers]
crons = ["*/5 * * * *"]   # retry stranded submissions every 5 minutes

[vars]
# Public, non-secret config. The Cloudflare Tunnel hostname for the home box.
HOME_ENDPOINT = "https://dashboard.jwcleaning.com/intake"

# SYNC_TOKEN is a SECRET. Never put it here.
#   wrangler secret put SYNC_TOKEN
